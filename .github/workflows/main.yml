
name: DreamMasterLite VST3 Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-vst3
          - os: macos-latest
            artifact: macos-vst3
          - os: ubuntu-latest
            artifact: linux-vst3

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            ladspa-sdk libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev \
            mesa-common-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Test DSP recipes
        run: |
          cmake --build build --config Release --target DreamMasterDSPTests --parallel 2
          ctest --test-dir build -C Release --output-on-failure

      - name: Build VST3
        run: cmake --build build --config Release --target DreamMasterLite_VST3 --parallel 2

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamMasterLite-${{ matrix.artifact }}
          path: build/**/DreamMasterLite.vst3/
          if-no-files-found: warn
